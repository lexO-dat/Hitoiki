name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
    # ubuntu-24.04 images ship with the Android SDK preinstalled ($ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.PAUSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pausa.keystore"
            echo "PAUSA_KEYSTORE=$RUNNER_TEMP/pausa.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::PAUSA_KEYSTORE_BASE64 secret not set: APK signed with a throwaway debug key"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          PAUSA_KEYSTORE_PASSWORD: ${{ secrets.PAUSA_KEYSTORE_PASSWORD }}
        run: |
          # On failure, surface Gradle's own error summary as a job annotation (readable without logs access).
          if ! ./gradlew assembleDebug --no-daemon > gradle.log 2>&1; then
            tail -n 60 gradle.log
            msg=$( (sed -n '/What went wrong/,/Try:/p' gradle.log; grep -E '^e: |error:|Duplicate class|Could not resolve' gradle.log) | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-see log}"
            exit 1
          fi

      - name: Package APK and web bundle
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Hitoiki-$APP_VERSION.apk"
          (cd dist && zip -qr "../web-$APP_VERSION.zip" .)
          NATIVE=$(grep -oP 'NATIVE_VERSION = \K[0-9]+' src/lib/updates.js)
          SHA=$(sha256sum "web-$APP_VERSION.zip" | cut -d' ' -f1)
          printf 'APK de Android: descarga el archivo .apk y ábrelo en el teléfono.\nSi ya tienes Hitoiki instalada, actualiza desde Ajustes → Actualizaciones.\n\n<!-- pausa-native: %s -->\n<!-- web-sha256: %s -->\n' "$NATIVE" "$SHA" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Hitoiki-apk
          path: |
            Hitoiki-*.apk
            web-*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hitoiki 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: |
            Hitoiki-*.apk
            web-*.zip
