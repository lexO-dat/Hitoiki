name: Tests

# Changes to tests or tooling only: run the test suites without publishing a release.
# (App changes run the same tests inside release.yml before building.)
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test

      - name: Unit tests in other timezones (streaks must not depend on them)
        run: npm run test:tz
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
