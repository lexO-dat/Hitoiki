name: Release

# A new version (APK + web update) is published only when something that ships inside the app
# changes. Docs-only or test-only pushes don't release (tests run in ci.yml).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'assets/**'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# No permission by default. The build runs code from dependencies (npm, Gradle) and sees the signing
# key, so it only gets read access; just the final publish job can write releases.
permissions:
  contents: read

jobs:
  apk:
    # ubuntu-24.04 images ship with the Android SDK preinstalled ($ANDROID_HOME).
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history: version number and release notes

      - name: Version
        id: version
        run: |
          scripts/next-version.sh | tee -a "$GITHUB_ENV"
          . <(scripts/next-version.sh)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Unit tests in other timezones (streaks must not depend on them)
        run: npm run test:tz

      - name: End-to-end tests (all games, daily loop, Android bridge, layout)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.PAUSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pausa.keystore"
            echo "PAUSA_KEYSTORE=$RUNNER_TEMP/pausa.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::PAUSA_KEYSTORE_BASE64 secret not set: APK signed with a throwaway debug key"
          fi

      - name: Build release APK
        working-directory: android
        env:
          PAUSA_KEYSTORE_PASSWORD: ${{ secrets.PAUSA_KEYSTORE_PASSWORD }}
        run: |
          # On failure, surface Gradle's own error summary as a job annotation (readable without logs access).
          if ! ./gradlew assembleRelease --no-daemon > gradle.log 2>&1; then
            tail -n 60 gradle.log
            msg=$( (sed -n '/What went wrong/,/Try:/p' gradle.log; grep -E '^e: |error:|Duplicate class|Could not resolve' gradle.log) | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-see log}"
            exit 1
          fi

      - name: Package APK and web bundle
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Hitoiki-$APP_VERSION.apk"
          (cd dist && zip -qr "../web-$APP_VERSION.zip" .)
          NATIVE=$(grep -oP 'NATIVE_VERSION = \K[0-9]+' src/lib/updates.js)
          SHA=$(sha256sum "web-$APP_VERSION.zip" | cut -d' ' -f1)
          {
            echo '## Cambios'
            git log --no-merges --pretty='- %s' ${PREV_TAG:+$PREV_TAG..}HEAD | head -n 40
            echo
            echo 'APK de Android: descarga el archivo .apk y ábrelo en el teléfono.'
            echo 'Si ya tienes Hitoiki instalada, actualiza desde Ajustes → Actualizaciones.'
            echo
            echo "<!-- pausa-native: $NATIVE -->"
            echo "<!-- web-sha256: $SHA -->"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            Hitoiki-*.apk
            web-*.zip
            release-notes.md

  publish:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the only job allowed to create the release and its tag
    env:
      APP_VERSION: ${{ needs.apk.outputs.version }}
    steps:
      # Only the signing script and the public key are needed here: no project code is built or run in this job.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sign-web.sh
            src/lib/ota-key.js
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Sign web bundle
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: scripts/sign-web.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          # Tag the commit that was built, not whatever main points to when the job ends.
          target_commitish: ${{ github.sha }}
          name: Hitoiki ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            Hitoiki-*.apk
            web-*.zip
