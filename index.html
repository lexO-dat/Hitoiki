<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" />
    <title>Hitoiki · puzzles diarios</title>
    <meta name="description" content="Once puzzles lógicos para tomarte un respiro (一息) cada día." />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!-- Loading screen: painted before any JavaScript loads, removed by main.jsx once the app is ready. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('logica-diaria:v1') || '{}').settings || {};
        var dark = t.theme === 'dark' || (t.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f3eee4; color: #2a2622; transition: opacity 0.45s ease, visibility 0.45s; }
      [data-theme='dark'] #boot { background: #1b1916; color: #efe8dc; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
      #boot .mark img { width: 64px; height: 64px; animation: boot-breathe 2.4s ease-in-out infinite; }
      #boot svg { position: absolute; inset: 0; transform: rotate(-4deg); }
      #boot path { fill: none; stroke: #cf4b2f; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: boot-draw 0.5s ease-out forwards; }
      #boot path:nth-child(2) { animation-delay: 0.15s; stroke-width: 6; }
      #boot path:nth-child(3) { animation-delay: 0.3s; }
      #boot path:nth-child(4) { animation-delay: 0.45s; stroke-width: 6; }
      #boot .name { margin-top: 18px; text-align: center; font: 700 26px 'Hiragino Mincho ProN', 'Noto Serif CJK JP', Georgia, serif; letter-spacing: 0.04em; }
      #boot .name small { display: block; margin-top: 2px; font-size: 14px; color: #cf4b2f; letter-spacing: 0.3em; }
      #boot .center { display: flex; flex-direction: column; align-items: center; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-breathe { 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { #boot path { animation: none; stroke-dashoffset: 0; } #boot .mark img { animation: none; } }
    </style>
    <div id="boot" aria-label="Cargando Hitoiki">
      <div class="center">
        <div class="mark">
          <svg viewBox="0 0 132 132" aria-hidden="true">
            <path d="M74.6 9.6 A57 57 0 0 1 122.4 57.4" />
            <path d="M122.4 74.6 A57 57 0 0 1 74.6 122.4" />
            <path d="M57.4 122.4 A57 57 0 0 1 9.6 74.6" />
            <path d="M9.6 57.4 A57 57 0 0 1 57.4 9.6" />
          </svg>
          <img src="./icons/logo.svg" alt="" />
        </div>
        <div class="name">Hitoiki<small>一息</small></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
